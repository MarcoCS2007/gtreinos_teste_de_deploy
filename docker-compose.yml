services:

  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - ./gtreinos/.env  # O Postgres vai ler as senhas daqui
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    env_file:
      - ./gtreinos/.env  # Injeta as variáveis de forma segura aqui!
    volumes:
      - static_volume:/app/static_root
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/static_root
      - media_volume:/app/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Volumes compartilhados para o SSL:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  static_volume:
  media_volume:
  postgres_data:  # NOVO: Volume persistente para salvar os dados do banco